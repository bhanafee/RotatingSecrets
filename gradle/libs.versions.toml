[versions]
# Java toolchain and minimum release for compiled artifacts
java = "25"
release = "17"

# Plugin versions
spring-boot = "4.1.1"
spring-cloud = "2025.1.3"
spring-dependency-management = "1.1.7"
git-version = "5.1.0"
spotless = "8.+"
owasp-dependencycheck = "13.+"

[libraries]
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-cloud-starter-circuitbreaker-resilience4j = { module = "org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j" }
spring-cloud-starter-vault-config = { module = "org.springframework.cloud:spring-cloud-starter-vault-config" }
spring-cloud-dependencies = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }
h2 = { module = "com.h2database:h2" }
oracle-ucp = { module = "com.oracle.database.jdbc:ucp" }
oracle-ojdbc = { module = "com.oracle.database.jdbc:ojdbc11" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# Security patches - Other
# jsoup 1.23.2 fixes CVE-2026-75140; supersedes the 1.23.1 pin for GHSA-dcmj-56c4-q8dh.
patch-cve-2026-75140 = { module = "org.jsoup:jsoup", version = { strictly = "[1.23.2,)", prefer = "1.23.2" } }
# jackson 2.22.3: core fixes CVE-2026-89407 and CVE-2026-89425; databind fixes CVE-2026-91776,
# CVE-2026-91777, CVE-2026-68497, CVE-2026-83557 and CVE-2026-19032. Supersedes the 2.22.1 pins
# for GHSA-72hv-8253-57qq, GHSA-5jmj-h7xm-6q6v and CVE-2026-54515.
# Keep core and databind aligned to avoid mixing across major version boundaries.
patch-cve-2026-89407 = { module = "com.fasterxml.jackson.core:jackson-core", version = { strictly = "[2.22.3,)", prefer = "2.22.3" } }
patch-cve-2026-91776 = { module = "com.fasterxml.jackson.core:jackson-databind", version = { strictly = "[2.22.3,)", prefer = "2.22.3" } }
# jackson 3.x (tools.jackson coordinates) 3.1.7: same fixes as 2.22.3 above. Supersedes the
# 3.1.5 pins for GHSA-5gvw-p9qm-jgwh. Core pinned to match databind for alignment.
patch-cve-2026-89407-tools-jackson-core = { module = "tools.jackson.core:jackson-core", version = { strictly = "[3.1.7,)", prefer = "3.1.7" } }
patch-cve-2026-91776-tools-jackson-databind = { module = "tools.jackson.core:jackson-databind", version = { strictly = "[3.1.7,)", prefer = "3.1.7" } }

# Security patches - Apache HttpComponents (DoS vulnerabilities)
patch-cve-2026-54428 = { module = "org.apache.httpcomponents.core5:httpcore5-h2", version = { strictly = "[5.4.3,)", prefer = "5.4.3" } }
patch-cve-2026-54399 = { module = "org.apache.httpcomponents.core5:httpcore5", version = { strictly = "[5.4.3,)", prefer = "5.4.3" } }
# httpclient5 5.6.4 fixes CVE-2026-71290 (async client ignores hostname verification); supersedes the 5.6.3 pin for CVE-2026-64607.
patch-cve-2026-71290 = { module = "org.apache.httpcomponents.client5:httpclient5", version = { strictly = "[5.6.4,)", prefer = "5.6.4" } }
patch-cve-2026-49844 = { module = "org.apache.logging.log4j:log4j-api", version = { strictly = "[2.25.5,)", prefer = "2.25.5" } }
patch-cve-2026-49844-log4j-to-slf4j = { module = "org.apache.logging.log4j:log4j-to-slf4j", version = { strictly = "[2.25.5,)", prefer = "2.25.5" } }

[bundles]
security-patches = ["patch-cve-2026-49844", "patch-cve-2026-49844-log4j-to-slf4j", "patch-cve-2026-54399", "patch-cve-2026-54428", "patch-cve-2026-71290", "patch-cve-2026-75140", "patch-cve-2026-89407", "patch-cve-2026-89407-tools-jackson-core", "patch-cve-2026-91776", "patch-cve-2026-91776-tools-jackson-databind"]

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
git-version = { id = "com.palantir.git-version", version.ref = "git-version" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
owasp-dependencycheck = { id = "org.owasp.dependencycheck", version.ref = "owasp-dependencycheck" }
