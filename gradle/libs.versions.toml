[versions]
# Java toolchain and minimum release for compiled artifacts
java = "25"
release = "17"

# BOM overrides for security patches
jackson = "2.22.1"
log4j = "2.25.5"

# Plugin versions
spring-boot = "4.1.0"
spring-cloud = "2025.1.2"
spring-dependency-management = "1.1.7"
spotless = "8.+"
owasp-dependencycheck = "12.+"

[libraries]
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-cloud-starter-circuitbreaker-resilience4j = { module = "org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j" }
spring-cloud-starter-vault-config = { module = "org.springframework.cloud:spring-cloud-starter-vault-config" }
spring-cloud-dependencies = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }
h2 = { module = "com.h2database:h2" }
oracle-ucp = { module = "com.oracle.database.jdbc:ucp" }
oracle-ojdbc = { module = "com.oracle.database.jdbc:ojdbc11" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# Security patches - BouncyCastle (CVE-2026-5598 covers all prior bcprov/bcpg CVEs)
patch-cve-2026-5598-bcpg = { module = "org.bouncycastle:bcpg-jdk18on", version = { strictly = "[1.84,)", prefer = "1.84" } }
patch-cve-2026-5598-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version = { strictly = "[1.84,)", prefer = "1.84" } }

# Security patches - Apache Commons
patch-cve-2025-48734 = { module = "commons-beanutils:commons-beanutils", version = { strictly = "[1.11.0,)", prefer = "1.11.0" } }
patch-cve-2025-48924 = { module = "org.apache.commons:commons-lang3", version = { strictly = "[3.18.0,)", prefer = "3.18.0" } }

# Security patches - Other
patch-cve-2022-45868 = { module = "com.h2database:h2", version = { strictly = "[2.2.220,)", prefer = "2.2.220" } }
patch-cve-2025-4949 = { module = "org.eclipse.jgit:org.eclipse.jgit", version = { strictly = "[6.10.1.202505221210-r,)", prefer = "6.10.1.202505221210-r" } }
patch-ghsa-dcmj-56c4-q8dh = { module = "org.jsoup:jsoup", version = { strictly = "[1.23.1,)", prefer = "1.23.1" } }
# jackson 2.22.1: core fixes GHSA-72hv-8253-57qq; databind fixes GHSA-5jmj-h7xm-6q6v and CVE-2026-54515.
# Keep core and databind aligned to avoid mixing across major version boundaries.
patch-ghsa-72hv-8253-57qq = { module = "com.fasterxml.jackson.core:jackson-core", version = { strictly = "[2.22.1,)", prefer = "2.22.1" } }
patch-ghsa-5jmj-h7xm-6q6v = { module = "com.fasterxml.jackson.core:jackson-databind", version = { strictly = "[2.22.1,)", prefer = "2.22.1" } }
patch-cve-2026-54515 = { module = "com.fasterxml.jackson.core:jackson-databind", version = { strictly = "[2.22.1,)", prefer = "2.22.1" } }
# jackson 3.x (tools.jackson coordinates): databind 3.1.5+ fixes GHSA-5gvw-p9qm-jgwh (@JsonView bypass
# on @JsonUnwrapped properties); core pinned to match for alignment.
patch-ghsa-5gvw-p9qm-jgwh-tools-jackson-core = { module = "tools.jackson.core:jackson-core", version = { strictly = "[3.1.5,)", prefer = "3.1.5" } }
patch-ghsa-5gvw-p9qm-jgwh-tools-jackson-databind = { module = "tools.jackson.core:jackson-databind", version = { strictly = "[3.1.5,)", prefer = "3.1.5" } }

# Security patches - Apache HttpComponents (DoS vulnerabilities)
patch-cve-2026-54428 = { module = "org.apache.httpcomponents.core5:httpcore5-h2", version = { strictly = "[5.4.3,)", prefer = "5.4.3" } }
patch-cve-2026-54399 = { module = "org.apache.httpcomponents.core5:httpcore5", version = { strictly = "[5.4.3,)", prefer = "5.4.3" } }
patch-cve-2026-64607 = { module = "org.apache.httpcomponents.client5:httpclient5", version = { strictly = "[5.6.3,)", prefer = "5.6.3" } }
patch-cve-2026-49844 = { module = "org.apache.logging.log4j:log4j-api", version = { strictly = "[2.25.5,)", prefer = "2.25.5" } }

[bundles]
security-patches = ["patch-cve-2022-45868", "patch-cve-2025-4949", "patch-cve-2025-48734", "patch-cve-2025-48924", "patch-cve-2026-5598-bcpg", "patch-cve-2026-5598-bcprov", "patch-cve-2026-49844", "patch-cve-2026-54399", "patch-cve-2026-54428", "patch-cve-2026-54515", "patch-cve-2026-64607", "patch-ghsa-72hv-8253-57qq", "patch-ghsa-5jmj-h7xm-6q6v", "patch-ghsa-5gvw-p9qm-jgwh-tools-jackson-core", "patch-ghsa-5gvw-p9qm-jgwh-tools-jackson-databind", "patch-ghsa-dcmj-56c4-q8dh"]

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
owasp-dependencycheck = { id = "org.owasp.dependencycheck", version.ref = "owasp-dependencycheck" }
