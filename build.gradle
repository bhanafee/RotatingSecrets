buildscript {
    repositories {
        mavenCentral()
    }
}

plugins {
    alias(libs.plugins.spring.boot) apply false
    alias(libs.plugins.spring.dependency.management) apply false
    alias(libs.plugins.git.version) apply false
    alias(libs.plugins.spotless) apply false
    alias(libs.plugins.owasp.dependencycheck) apply false
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'jvm-test-suite'
    apply plugin: 'jacoco'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'com.palantir.git-version'
    apply plugin: 'com.diffplug.spotless'
    apply plugin: 'org.owasp.dependencycheck'

    group = 'com.maybeitssquid'
    version = gitVersion().replaceAll('^v', '')  // Strip 'v' prefix from git tags

    repositories {
        mavenCentral()
    }

    // Dynamic version ranges otherwise resolve to prereleases; slf4j "2.+" picks up 2.1.0-alpha1.
    // Match known prerelease qualifiers rather than allowlisting stable ones. Stable releases carry
    // odd suffixes — 0.0.20131108.vaadin1 and 2.3.1-b170201.1204 are both stable — and an allowlist
    // rejects them, breaking resolution of transitive dependencies.
    configurations.all {
        resolutionStrategy.componentSelection.all { selection ->
            if (selection.candidate.version ==~ /(?i).*[.\-](alpha|beta|rc|cr|snapshot|preview|dev|milestone|m\d+)[.\-]?\d*$/) {
                selection.reject('prerelease version')
            }
        }
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${libs.versions.spring.boot.get()}"
            // Jackson BOMs import after Spring Boot's, so they override its Jackson versions and
            // keep every module aligned. Jackson 2 last so its jackson-annotations wins over Jackson 3's.
            mavenBom "tools.jackson:jackson-bom:${libs.versions.jackson3.get()}"
            mavenBom "com.fasterxml.jackson:jackson-bom:${libs.versions.jackson.get()}"
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(libs.versions.java.get())
        }
        withSourcesJar()
        withJavadocJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = libs.versions.release.get().toInteger()
    }

    dependencies {
        constraints {
            libs.bundles.security.patches.get().each {
                add('implementation', it)
            }
        }
    }

    testing {
        suites.test {
            useJUnitJupiter()
            dependencies {
                implementation libs.spring.boot.starter.test
                runtimeOnly libs.junit.platform.launcher
            }
        }
    }

    tasks.named('jacocoTestReport') {
        dependsOn tasks.named('test')
        reports {
            html.required = true
            xml.required = false
        }
    }

    spotless {
        java {
            targetExclude 'src/*/java/module-info.java'
            googleJavaFormat()
            removeUnusedImports()
            trimTrailingWhitespace()
            endWithNewline()
        }
    }

    dependencyCheck {
        failBuildOnCVSS = 7
        suppressionFile = rootProject.file('config/dependency-check-suppressions.xml').path
    }

    tasks.withType(Javadoc).configureEach {
        options {
            encoding = 'UTF-8'
            links "https://docs.oracle.com/en/java/javase/${libs.versions.java.get()}/docs/api/"
            addBooleanOption('html5', true)
        }
    }
}

// The library is published; the demo is a Spring Boot application and is not.
project(':rotating-secrets') {
    apply plugin: 'maven-publish'

    // The dependency-management plugin adds the imported BOMs to the POM through a withXml action
    // that holds Project references, so POM generation cannot use the configuration cache.
    tasks.withType(GenerateMavenPom).configureEach {
        notCompatibleWithConfigurationCache('io.spring.dependency-management POM customization')
    }

    publishing {
        repositories {
            maven {
                name = 'GitHubPackages'
                url = uri("https://maven.pkg.github.com/${System.env.GITHUB_REPOSITORY ?: 'bhanafee/RotatingSecrets'}")
                credentials {
                    username = System.env.USERNAME ?: System.env.GITHUB_ACTOR
                    password = System.env.TOKEN ?: System.env.GITHUB_TOKEN
                }
            }
        }
        publications {
            mavenJava(MavenPublication) {
                from components.java
                artifactId = 'rotating-secrets'
                pom {
                    name = 'RotatingSecrets'
                    description = 'Zero-downtime Kubernetes credential rotation for connection pools'
                    url = 'https://github.com/bhanafee/RotatingSecrets'
                    licenses {
                        license {
                            name = 'Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0'
                        }
                    }
                    scm {
                        url = 'https://github.com/bhanafee/RotatingSecrets'
                        connection = 'scm:git:git://github.com/bhanafee/RotatingSecrets.git'
                        developerConnection = 'scm:git:ssh://github.com/bhanafee/RotatingSecrets.git'
                    }
                }
            }
        }
    }
}
