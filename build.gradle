buildscript {
    repositories {
        mavenCentral()
    }
}

plugins {
    alias(libs.plugins.spring.boot) apply false
    alias(libs.plugins.spring.dependency.management) apply false
    alias(libs.plugins.git.version) apply false
    alias(libs.plugins.spotless) apply false
    alias(libs.plugins.owasp.dependencycheck) apply false
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'jvm-test-suite'
    apply plugin: 'jacoco'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'com.palantir.git-version'
    apply plugin: 'com.diffplug.spotless'
    apply plugin: 'org.owasp.dependencycheck'

    group = 'com.maybeitssquid'
    version = gitVersion().replaceAll('^v', '')  // Strip 'v' prefix from git tags

    repositories {
        mavenCentral()
    }

    // shared:begin build
    // Dynamic version ranges otherwise resolve to prereleases; slf4j "2.+" picks up 2.1.0-alpha1.
    // Match known prerelease qualifiers rather than allowlisting stable ones. Stable releases carry
    // odd suffixes — 0.0.20131108.vaadin1 and 2.3.1-b170201.1204 are both stable — and an allowlist
    // rejects them, breaking resolution of transitive dependencies.
    configurations.all {
        resolutionStrategy.componentSelection.all { selection ->
            if (selection.candidate.version ==~ /(?i).*[.\-](alpha|beta|rc|cr|snapshot|preview|dev|milestone|m\d+)[.\-]?\d*$/) {
                selection.reject('prerelease version')
            }
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(libs.versions.java.get())
        }
        withSourcesJar()
        withJavadocJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = libs.versions.release.get().toInteger()
    }

    dependencies {
        constraints {
            libs.bundles.security.patches.get().each {
                add('implementation', it)
            }
        }
    }

    tasks.named('jacocoTestReport') {
        dependsOn tasks.named('test')
        reports {
            html.required = true
            xml.required = false
        }
    }

    spotless {
        java {
            targetExclude 'src/*/java/module-info.java'
            googleJavaFormat()
            removeUnusedImports()
            trimTrailingWhitespace()
            endWithNewline()
        }
    }

    // The NVD key is optional. Without one, the check uses the local NVD cache and warns.
    def nvdKey = providers.environmentVariable('NVD_API_KEY')
        .orElse(providers.gradleProperty('nvd.apiKey')).orNull

    dependencyCheck {
        failBuildOnCVSS = 7
        if (nvdKey) {
            nvd { apiKey = nvdKey }
        } else {
            autoUpdate = false
        }
    }

    tasks.named('dependencyCheckAnalyze') {
        doFirst {
            if (!nvdKey) {
                logger.warn('NVD_API_KEY is not set: using the local NVD cache without a live update.')
            }
        }
    }

    tasks.withType(Javadoc).configureEach {
        options {
            encoding = 'UTF-8'
            links "https://docs.oracle.com/en/java/javase/${libs.versions.java.get()}/docs/api/"
            addBooleanOption('html5', true)
            // Standard JDK documentation tags are not registered for non-JDK code by default
            tags(
                    'apiNote:a:API Note:',
                    'implSpec:a:Implementation Requirements:',
                    'implNote:a:Implementation Note:'
            )
        }
    }
    // shared:end build

    // Imported BOMs win over the catalog's security-patch constraints for the modules they manage,
    // so those modules also need a dependencyManagement override. The versions come from the patch
    // entries in the catalog, so each patched version is declared only once.
    ext.patchVersion = { String module ->
        def patch = libs.bundles.security.patches.get().find { it.module.toString() == module }
        if (patch == null) {
            throw new GradleException("No security-patches entry for ${module}")
        }
        patch.versionConstraint.preferredVersion
    }
    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${libs.versions.spring.boot.get()}"
            // Jackson BOMs import after Spring Boot's, so they override its Jackson versions and
            // keep every module aligned. Jackson 2 last so its jackson-annotations wins over Jackson 3's.
            mavenBom "tools.jackson:jackson-bom:${patchVersion('tools.jackson.core:jackson-databind')}"
            mavenBom "com.fasterxml.jackson:jackson-bom:${patchVersion('com.fasterxml.jackson.core:jackson-databind')}"
        }
    }
    dependencyCheck {
        suppressionFile = rootProject.file('config/dependency-check-suppressions.xml').path
    }

    testing {
        suites.test {
            // The version comes from the Spring Boot BOM. Without one, useJUnitJupiter() declares Gradle's
            // default, and the dependency-management plugin lets a declared version win over the BOM. Read
            // lazily, so BOMs imported later in the build (such as a subproject's Spring Cloud BOM) count.
            useJUnitJupiter(provider { dependencyManagement.importedProperties['junit-jupiter.version'] })
            dependencies {
                implementation libs.spring.boot.starter.test
                runtimeOnly libs.junit.platform.launcher
            }

            // Tests run on the JDK named by -PtestJava (CI passes each matrix version); without it, on the
            // toolchain. Compilation always uses the toolchain, targeting the release version.
            targets.configureEach {
                testTask.configure {
                    javaLauncher = javaToolchains.launcherFor {
                        languageVersion = providers.gradleProperty('testJava')
                                .orElse(libs.versions.java)
                                .map { JavaLanguageVersion.of(it) }
                    }
                    // Log the test JVM so each CI job shows which Java its tests ran on.
                    doFirst { task ->
                        def jvm = task.javaLauncher.get().metadata
                        task.logger.lifecycle("Tests run on Java ${jvm.javaRuntimeVersion} (${jvm.vendor}, ${jvm.installationPath})")
                    }
                }
            }
        }
    }
}

// The libraries are published; the demo is a Spring Boot application and is not.
def libraryDescriptions = [
    'rotating-secrets': 'Zero-downtime Kubernetes credential rotation for connection pools',
    'rotating-secrets-hikari': 'HikariCP adapter for RotatingSecrets credential rotation',
    'rotating-secrets-ucp': 'Oracle UCP adapter for RotatingSecrets credential rotation',
    'rotating-secrets-spring': 'Spring configuration for RotatingSecrets credential rotation',
]

libraryDescriptions.each { String artifact, String description ->
    project(":${artifact}") {
        apply plugin: 'maven-publish'

        // The dependency-management plugin adds the imported BOMs to the POM through a withXml action
        // that holds Project references, so POM generation cannot use the configuration cache.
        tasks.withType(GenerateMavenPom).configureEach {
            notCompatibleWithConfigurationCache('io.spring.dependency-management POM customization')
        }

        publishing {
            repositories {
                maven {
                    name = 'GitHubPackages'
                    url = uri("https://maven.pkg.github.com/${System.env.GITHUB_REPOSITORY ?: 'bhanafee/RotatingSecrets'}")
                    credentials {
                        username = System.env.USERNAME ?: System.env.GITHUB_ACTOR
                        password = System.env.TOKEN ?: System.env.GITHUB_TOKEN
                    }
                }
            }
            publications {
                mavenJava(MavenPublication) {
                    from components.java
                    artifactId = artifact
                    pom {
                        name = artifact
                        description = description
                        url = 'https://github.com/bhanafee/RotatingSecrets'
                        licenses {
                            license {
                                name = 'Apache License, Version 2.0'
                                url = 'https://www.apache.org/licenses/LICENSE-2.0'
                            }
                        }
                        scm {
                            url = 'https://github.com/bhanafee/RotatingSecrets'
                            connection = 'scm:git:git://github.com/bhanafee/RotatingSecrets.git'
                            developerConnection = 'scm:git:ssh://github.com/bhanafee/RotatingSecrets.git'
                        }
                    }
                }
            }
        }
    }
}
