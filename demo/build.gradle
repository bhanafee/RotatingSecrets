apply plugin: 'org.springframework.boot'

dependencies {
    implementation project(':rotating-secrets')
    implementation libs.spring.cloud.starter.circuitbreaker.resilience4j
    implementation libs.spring.cloud.starter.vault.config
    runtimeOnly libs.h2
}

dependencyManagement {
    imports {
        mavenBom libs.spring.cloud.dependencies.get().toString()
        // Spring Cloud's BOM re-manages Jackson, so re-import the Jackson BOMs after it
        // (same order and reason as the root build.gradle).
        mavenBom "tools.jackson:jackson-bom:${libs.versions.jackson3.get()}"
        mavenBom "com.fasterxml.jackson:jackson-bom:${libs.versions.jackson.get()}"
    }

    // Override BOM-managed versions for security patches (versions from catalog)
    dependencies {
        dependency "org.apache.httpcomponents.core5:httpcore5-h2:${libs.versions.httpcore5H2.get()}"
        dependency "org.apache.httpcomponents.core5:httpcore5:${libs.versions.httpcore5Core.get()}"
        dependency "org.apache.httpcomponents.client5:httpclient5:${libs.versions.httpclient5.get()}"
        dependency "org.apache.logging.log4j:log4j-api:${libs.versions.log4jApi.get()}"
        dependency "org.apache.logging.log4j:log4j-to-slf4j:${libs.versions.log4jApi.get()}"
    }
}
