apply plugin: 'org.springframework.boot'

dependencies {
    implementation project(':rotating-secrets-hikari')
    implementation project(':rotating-secrets-ucp')
    implementation libs.spring.boot.starter.data.jpa
    implementation libs.spring.cloud.starter.circuitbreaker.resilience4j
    implementation libs.spring.cloud.starter.vault.config
    runtimeOnly libs.oracle.ojdbc
    runtimeOnly libs.h2
}

dependencyManagement {
    imports {
        mavenBom libs.spring.cloud.dependencies.get().toString()
        // Spring Cloud's BOM re-manages Jackson, so re-import the Jackson BOMs after it
        // (same order and reason as the root build.gradle).
        mavenBom "tools.jackson:jackson-bom:${patchVersion('tools.jackson.core:jackson-databind')}"
        mavenBom "com.fasterxml.jackson:jackson-bom:${patchVersion('com.fasterxml.jackson.core:jackson-databind')}"
    }

    // Security-patch overrides for modules the BOMs manage (versions from the catalog patch entries)
    dependencies {
        [
            'org.apache.httpcomponents.core5:httpcore5-h2',
            'org.apache.httpcomponents.core5:httpcore5',
            'org.apache.httpcomponents.client5:httpclient5',
            'org.apache.logging.log4j:log4j-api',
            'org.apache.logging.log4j:log4j-to-slf4j',
        ].each { module ->
            dependency "${module}:${patchVersion(module)}"
        }
    }
}
